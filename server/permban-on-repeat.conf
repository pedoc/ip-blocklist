[Definition]
# Escalate from a timed ban to a permanent one once an address has been banned
# more than once.
#
# norestored matters: fail2ban re-runs ban actions for bans it restores from its
# database on restart. Those are not new offences, and without this flag every
# restart could permanently block addresses that had merely been banned once.
#
# <bancount> is passed for logging only. It reads 1 on every fresh ticket
# because fail2ban increments it after the action runs; the script decides from
# the recorded ban history instead.
#
# Detached with systemd-run so the database read and ipset reload never delay
# the firewall action that applies the current ban.
#
# Threshold is set by PERMBAN_THRESHOLD in the script (default 2).

norestored = true

actionstart =
actionstop =
actioncheck =

actionban = /usr/bin/systemd-run --quiet --collect --no-block --property=RuntimeMaxSec=30s \
            -- /usr/local/libexec/permban-on-repeat.sh '<ip>' '<bancount>' '<name>'

actionunban =
