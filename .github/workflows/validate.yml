name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate blocklist.txt and blocklist.json
        run: python3 tools/validate.py

      - name: Shell syntax check
        run: |
          for f in install.sh scripts/*.sh; do
            sh -n "$f" || { echo "syntax error in $f"; exit 1; }
          done

      - name: systemd units parse
        run: |
          systemd-analyze verify systemd/ip-blocklist.service systemd/ip-blocklist.timer
